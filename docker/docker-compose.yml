services:
  tool:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      demo-db: {condition: service_healthy}
      staging-db: {condition: service_healthy}
    volumes: ["../out:/app/out"]
    environment:
      # Соль обязана быть задана снаружи. Умолчания нет ни в инструменте, ни
      # здесь: демо на публично известной соли выглядело бы как рабочий прогон.
      # Makefile задаёт для демонстрации значение с говорящим именем.
      MASTER_SALT: ${MASTER_SALT:?задайте MASTER_SALT (для демо см. Makefile)}
      RECIPIENT: ${RECIPIENT:-dev}
      GENERATION: ${GENERATION:-g1}
    profiles: ["tool"]

  demo-db:
    image: postgres:17
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 3s
      retries: 20

  staging-db:
    image: postgres:17
    environment:
      POSTGRES_USER: staging
      POSTGRES_PASSWORD: staging
      POSTGRES_DB: staging
    ports: ["55433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging"]
      interval: 3s
      retries: 20

# Сервис ollama убран: поставщика LLM в конвейере нет (см. docs/solution-design.md
# §4.2, «отклонение: LLM»). Держать поднятый контейнер, к которому никто не
# обращается, значит обещать механизм, которого не существует.
