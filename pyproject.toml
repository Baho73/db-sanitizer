[project]
name = "db-sanitizer"
version = "0.1.0"
description = "Обезличивание PostgreSQL-баз: LLM-план, детерминированное исполнение (Greenmask + Cmd), верификация"
requires-python = ">=3.12"
dependencies = [
    "faker>=25",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    "langgraph>=0.2",
    # SqliteSaver (человеческий гейт между процессами) на langgraph 0.2.x -
    # отдельный пакет; без него дефолтный путь CLI падает при pip-установке
    "langgraph-checkpoint-sqlite>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
